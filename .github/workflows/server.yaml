name: Api

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.GUTENGUESS_DEPLOY_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Copy env
        run: cp packages/server/.env.example packages/server/.env

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm --filter @gutenku/server lint

      - name: Build shared packages
        run: pnpm --filter @gutenku/shared --filter @gutenguess/shared build

      - name: Build
        run: pnpm --filter @gutenku/server build

      - name: Typecheck
        run: pnpm --filter @gutenku/server typecheck

      - name: Test (with coverage)
        run: pnpm --filter @gutenku/server test:cov
